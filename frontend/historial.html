<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Historial y Analítica | PlataformaRedes</title>

  <!-- Bootstrap 5 + Icons + Estilos personalizados -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/historial.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="/dashboard">
        <i class="bi bi-hdd-stack"></i> PlataformaRedes
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
        aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="/dashboard">
              <i class="bi bi-speedometer2"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/historial">
              <i class="bi bi-clock-history"></i> Historial
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/escaneo_automatico">
              <i class="bi bi-calendar-check"></i> Escaneo Automático
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-3">
    <div class="row g-2">

      <!-- Fila 1: Estadísticas clave -->
      <div class="col-lg-4 col-md-6">
        <div class="card h-100">
          <div class="card-header bg-transparent border-0 d-flex align-items-center gap-2">
            <i class="bi bi-bar-chart-fill text-primary fs-5"></i>
            <h5 class="card-title mb-0">Promedio por escaneo</h5>
          </div>
          <div class="card-body d-flex align-items-center justify-content-center">
            <canvas id="chart-avg" style="max-height: 140px; width: 100%;"></canvas>
          </div>
        </div>
      </div>

      <div class="col-lg-4 col-md-6">
        <div class="card h-100">
          <div class="card-header bg-transparent border-0 d-flex align-items-center gap-2">
            <i class="bi bi-diagram-3 text-info fs-5"></i>
            <h5 class="card-title mb-0">Tipos de dispositivo</h5>
          </div>
          <div class="card-body d-flex align-items-center justify-content-center">
            <canvas id="chart-tipo" style="max-height: 140px; width: 100%;"></canvas>
          </div>
        </div>
      </div>

      <div class="col-lg-4 col-md-6">
        <div class="card h-100">
          <div class="card-header bg-transparent border-0 d-flex align-items-center gap-2">
            <i class="bi bi-shield-check text-success fs-5"></i>
            <h5 class="card-title mb-0">Confiabilidad</h5>
          </div>
          <div class="card-body d-flex align-items-center justify-content-center">
            <canvas id="chart-confianza" style="max-height: 140px; width: 100%;"></canvas>
          </div>
        </div>
      </div>

      <!-- Fila 2: Alertas y duración -->
      <div class="col-lg-6 col-md-12">
        <div class="card h-100">
          <div class="card-header bg-transparent border-0 d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-triangle text-warning fs-5"></i>
            <h5 class="card-title mb-0">Alertas por día</h5>
          </div>
          <div class="card-body">
            <canvas id="chart-alerts-per-day" style="max-height: 180px; width: 100%;"></canvas>
          </div>
        </div>
      </div>

      <div class="col-lg-6 col-md-12">
        <div class="card h-100">
          <div class="card-header bg-transparent border-0 d-flex align-items-center gap-2">
            <i class="bi bi-hourglass-split text-info fs-5"></i>
            <h5 class="card-title mb-0">Duración promedio (segundos)</h5>
          </div>
          <div class="card-body">
            <canvas id="chart-scan-duration" style="max-height: 180px; width: 100%;"></canvas>
          </div>
        </div>
      </div>

      <!-- Fila 3: Top dispositivos y serie temporal -->
      <div class="col-lg-5 col-md-12">
        <div class="card h-100">
          <div class="card-header bg-transparent border-0 d-flex align-items-center gap-2">
            <i class="bi bi-trophy-fill text-primary fs-5"></i>
            <h5 class="card-title mb-0">Dispositivos más frecuentes</h5>
          </div>
          <div class="card-body">
            <canvas id="chart-top-devices" style="max-height: 200px; width: 100%;"></canvas>
          </div>
        </div>
      </div>

      <div class="col-lg-7 col-md-12">
        <div class="card h-100">
          <div
            class="card-header bg-transparent border-0 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="d-flex align-items-center gap-2">
              <i class="bi bi-calendar-week fs-5 text-success"></i>
              <h5 class="card-title mb-0">Serie temporal de escaneos</h5>
            </div>
            <select id="period-select" class="form-select w-auto" style="min-width: 110px;">
              <option value="day">📅 Día</option>
              <option value="week">📆 Semana</option>
              <option value="month">📊 Mes</option>
            </select>
          </div>
          <div class="card-body">
            <canvas id="chart-timeseries" style="max-height: 200px; width: 100%;"></canvas>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/js/historial.js"></script>
</body>

</html>
