<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Plataforma de Escaneo de Red</title>

  <link rel="stylesheet" href="/css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/dashboard">PlataformaRedes</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="/dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/historial">Historial</a></li>
          <li class="nav-item"><a class="nav-link" href="/escaneo_automatico">Escaneo Automático</a></li>
        </ul>

        <div class="d-flex align-items-center gap-2">
          <button id="btn-alertas" class="btn btn-outline-light position-relative" type="button">
            <i class="bi bi-bell"></i>
            <span id="badge-alertas"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
          </button>
          <button id="btn-refresh" class="btn btn-primary" type="button">
            <i class="bi bi-arrow-clockwise"></i> Escanear
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-4">
    <div class="row g-4 mb-4">
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Total dispositivos</h5>
            <p id="stat-total" class="display-6 mb-0">0</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Activos</h5>
            <p id="stat-activos" class="display-6 mb-0">0</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Inactivos</h5>
            <p id="stat-inactivos" class="display-6 mb-0">0</p>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header d-flex flex-wrap gap-2 justify-content-between align-items-center">
        <h5 class="mb-0">Dispositivos detectados</h5>
        <div class="d-flex flex-wrap gap-2">
          <input id="search-input" type="text" class="form-control" placeholder="Buscar por nombre, IP o MAC">
          <select id="filter-tipo" class="form-select">
            <option value="">Todos los tipos</option>
          </select>
          <select id="filter-confiable" class="form-select">
            <option value="">Todos</option>
            <option value="true">Confiables</option>
            <option value="false">No confiables</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0" id="tabla-dispositivos">
          <thead class="table-light">
            <tr>
              <th>Nombre</th>
              <th>IP</th>
              <th>MAC</th>
              <th>Estado</th>
              <th>Tipo</th>
              <th>Confiable</th>
              <th>Última detección</th>
              <th>Notas</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal fade" id="alertasModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Alertas</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="contenido-alertas"></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="notaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar nota</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="nota-mac">
          <textarea id="nota-texto" class="form-control" rows="5" placeholder="Escribe una nota..."></textarea>
        </div>
        <div class="modal-footer">
          <button id="guardar-nota" class="btn btn-primary" type="button">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/dashboard.js"></script>
</body>

</html>
