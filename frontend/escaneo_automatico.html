<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escaneo Automático</title>

  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/escaneo_automatico.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/dashboard">PlataformaRedes</a>
      <div class="navbar-nav">
        <a class="nav-link" href="/dashboard">Dashboard</a>
        <a class="nav-link" href="/historial">Historial</a>
        <a class="nav-link active" href="/escaneo_automatico">Escaneo Automático</a>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-4">
    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4 class="mb-3">Programar escaneo</h4>

            <div class="mb-3">
              <label class="form-label" for="tipo-escaneo">Tipo</label>
              <select id="tipo-escaneo" class="form-select">
                <option value="completo">Completo</option>
                <option value="rapido">Rápido</option>
                <option value="personalizado">Personalizado</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label" for="fecha-escaneo">Fecha y hora</label>
              <input id="fecha-escaneo" type="datetime-local" class="form-control">
            </div>

            <div class="mb-3">
              <label class="form-label" for="repetir-escaneo">Repetición</label>
              <select id="repetir-escaneo" class="form-select">
                <option value="una_vez">Una vez</option>
                <option value="diario">Diario</option>
                <option value="semanal">Semanal</option>
                <option value="mensual">Mensual</option>
              </select>
            </div>

            <div id="resumen-escaneo" class="border rounded p-3 mb-3 bg-light"></div>

            <button id="btn-programar" class="btn btn-primary" type="button">
              <i class="bi bi-calendar-plus"></i> Programar
            </button>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4 class="mb-3">Escaneos programados</h4>
            <div class="table-responsive">
              <table id="tabla-escaneos" class="table align-middle">
                <thead>
                  <tr>
                    <th>Tipo</th>
                    <th>Fecha</th>
                    <th>Repetición</th>
                    <th>Estado</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="confirmacionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirmación</h5>
        </div>
        <div class="modal-body">
          <p id="confirmacion-texto" class="mb-0"></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Cerrar</button>
          <button id="confirmar-accion" class="btn btn-danger" type="button">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/escaneo_automatico.js"></script>
</body>

</html>
